name: dimai-yichang-demo

services:
  geo-rag-api:
    build:
      context: ./ai/geo_rag
    environment:
      RAG_SEARCH_BACKEND: sqlite
      RAG_DB_PATH: /data/geo_rag.sqlite3
      RAG_UPLOAD_DIR: /data/documents
      RAG_WORKSPACE_DIR: /data/workspace
      CORS_ORIGINS: http://127.0.0.1:5174,http://localhost:5174,http://127.0.0.1:5175,http://localhost:5175
    volumes:
      - geo-rag-data:/data
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    init: true

  geo-agent-graph:
    build:
      context: ./ai/geo-agent-graph
    environment:
      RAG_BASE_URL: http://geo-rag-api:8010
      YICHANG_GOLD_DB_PATH: /runtime/yichang_gold.sqlite3
      YICHANG_GOLD_FIXTURE_DIR: /fixtures
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
    volumes:
      - ./data/demo-gold:/fixtures:ro
      - gold-data:/runtime
    ports:
      - "127.0.0.1:8011:8011"
    depends_on:
      geo-rag-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    init: true

  yichang-web:
    build:
      context: ./frontend/geo-guard-fe
    environment:
      VITE_DEV_HTTPS: "false"
      VITE_YICHANG_GOLD_API_URL: http://geo-agent-graph:8011
      VITE_GEO_AGENT_SERVICE_URL: http://geo-agent-graph:8011
      VITE_APP_SERVER_URL: http://geo-rag-api:8010
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      geo-agent-graph:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174/demo').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    init: true

  geo-rag-ui:
    build:
      context: ./frontend/geo_rag
    environment:
      VITE_API_URL: http://geo-rag-api:8010
    ports:
      - "127.0.0.1:5175:5175"
    depends_on:
      geo-rag-api:
        condition: service_healthy
    init: true

volumes:
  geo-rag-data:
  gold-data:
